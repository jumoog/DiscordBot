services:
  hypetrain_discordbot:
    image: ghcr.io/jumoog/discordbot:bun
    environment:
      - USERID=${USERID}
      - ROOMNAME=${ROOMNAME}
      - CLIENTID=${CLIENTID}
      - CLIENTSECRET=${CLIENTSECRET}
      - DISCORDTOKEN=${DISCORDTOKEN}
      - DEBUGROOMNAME=${DEBUGROOMNAME}
      - SHOUTOUTROOMNAME=${SHOUTOUTROOMNAME}
      - SOCIALSROOMNAME=${SOCIALSROOMNAME}
      - MODLOGROOMNAME=${MODLOGROOMNAME}
    restart: "always"
    volumes:
      - /home/HypetrainDiscordBot/:/tokens/
